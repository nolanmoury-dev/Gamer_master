<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamer Master – jeux gratuits et classement</title>
<meta name="description" content="Gamer Master : jeux gratuits dans ton navigateur, meilleur score de chaque jeu et pages web, by Noln_mry.">
<link rel="icon" href="/logo.png">
<meta name="google-site-verification" content="A_REMPLACER">
<style>
:root{--g:#16a34a;--g2:#15803d;--b:#1e40af;--b2:#2563eb;--t:#0f172a;--l:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;color:var(--t);background:#fff}
main{max-width:920px;margin:auto;padding:16px}h2{margin:24px 0 10px}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--l)}
.logo{font-weight:800;font-size:22px;color:var(--b);margin-right:auto}
button,select,input,textarea{font:inherit;border-radius:10px;border:1px solid var(--l);padding:10px 14px}
button{cursor:pointer;background:var(--g);color:#fff;border:0;font-weight:600}button:hover{background:var(--g2)}
button.b{background:var(--b2)}button.b:hover{background:var(--b)}button.o{background:#fff;color:var(--t);border:1px solid var(--l)}button.r{background:#dc2626}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--b2);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--l);border-radius:14px;padding:16px}.card.off{opacity:.5}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:#dcfce7;color:#166534}.badge.x{background:#fee2e2;color:#991b1b}
.c{text-align:center;padding:40px 16px;max-width:520px;margin:auto}
.bar{height:10px;background:var(--l);border-radius:9px;overflow:hidden;margin:16px 0}.bar i{display:block;height:100%;background:var(--g);animation:ld 2.6s linear forwards}@keyframes ld{from{width:0}to{width:100%}}
.tip{text-align:left;background:#f1f5f9;border-radius:12px;padding:12px;margin:12px 0}pre{background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px;overflow:auto}
.sn{stroke-dasharray:240;animation:mv 3s ease-in-out infinite alternate}@keyframes mv{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
.shk{animation:sh .5s infinite}@keyframes sh{50%{transform:translateX(2px)}}
@media(prefers-reduced-motion:reduce){.sn,.shk,.bar i{animation-duration:0s}}
.demo{background:#dbeafe;color:var(--b);padding:8px 16px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--l);text-align:left}
form>*{margin:4px 0;width:100%}.row{overflow-x:auto}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LG='<img src="/logo.png" alt="" height="44" style="vertical-align:middle;margin-right:8px">GAMER MASTER';
const T={fr:{login:'Connexion',signup:'Créer un compte',pseudo:'Pseudo',pass:'Mot de passe (6 caractères min.)',lang:'Langue',games:'Jeux',sites:'Les sites',pages:'Pages web',best:'Meilleur',none:'Aucun score',play:'Jouer',open:'Ouvrir',avail:'Disponible',un:'Indisponible',profile:'Profil',out:'Déconnexion',demo:'Mode démo : signale un bug depuis ton profil.',bug:'Signaler un bug',msg:'Décris le bug',send:'Envoyer le bug',sent:'Merci, bug envoyé !',nodemo:"Le mode démo n'est pas actif.",banned:'Vous avez été banni',until:"Jusqu'au",maint:'Maintenance en cours',msub:'Reviens bientôt !',load:'Chargement…',bad:'Pseudo ou mot de passe incorrect',invalid:'Pseudo de 3 à 20 caractères (lettres, chiffres . _ -) et mot de passe de 6 caractères min.',taken:'Ce pseudo est déjà pris',op:'Opérateur',back:'Retour'},
en:{login:'Log in',signup:'Create account',pseudo:'Username',pass:'Password (6+ characters)',lang:'Language',games:'Games',sites:'Sites',pages:'Web pages',best:'Best',none:'No score yet',play:'Play',open:'Open',avail:'Available',un:'Unavailable',profile:'Profile',out:'Log out',demo:'Demo mode: report bugs from your profile.',bug:'Report a bug',msg:'Describe the bug',send:'Send bug',sent:'Thanks, bug sent!',nodemo:'Demo mode is off.',banned:'You have been banned',until:'Until',maint:'Maintenance in progress',msub:'Back soon!',load:'Loading…',bad:'Wrong username or password',invalid:'Username 3-20 characters (letters, digits . _ -), password 6+ characters',taken:'Username already taken',op:'Operator',back:'Back'}};
let L=localStorage.lang||'fr',tk=localStorage.tk,H,O,mode='login';const t=k=>T[L][k]||k,show=h=>$('#app').innerHTML=h;
const GAMES=[['camion','Monster Climb','/camion.html'],['snake','Snake','/snake.html']];
async function api(a,d={}){try{return await(await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,t:tk,...d})})).json()}catch{return{err:'net'}}}
function cage(h,s,lock){return`<div class="c"><svg viewBox="0 0 200 140" width="240" aria-hidden="true"><g class="${lock?'':'shk'}"><rect x="20" y="20" width="160" height="100" rx="8" fill="none" stroke="#1e40af" stroke-width="4"/>${[50,80,110,140,170].map(x=>`<line x1="${x}" y1="20" x2="${x}" y2="120" stroke="#1e40af" stroke-width="3"/>`).join('')}</g><path class="sn" d="M40 100 Q70 60 100 90 T160 70" fill="none" stroke="#16a34a" stroke-width="9" stroke-linecap="round"/>${lock?'<rect x="88" y="64" width="24" height="20" rx="3" fill="#1e40af"/><path d="M93 64v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#1e40af" stroke-width="4"/>':''}</svg><h2>${h}</h2><p>${s}</p><small>by Noln_mry</small><p><button class="o" onclick="out()">${t('out')}</button></p></div>`}
function auth(m=mode,e=''){mode=m;show(`<div class="c"><div class="logo" style="margin:0">${LG}</div><small>by Noln_mry</small><p><button class="${m=='login'?'':'o'}" onclick="auth('login')">${t('login')}</button> <button class="${m=='signup'?'b':'o'}" onclick="auth('signup')">${t('signup')}</button></p><form onsubmit="go(event)"><input id="p" placeholder="${t('pseudo')}" autocomplete="username" required><input id="w" type="password" placeholder="${t('pass')}" autocomplete="${m=='login'?'current-password':'new-password'}" required>${m=='signup'?'<select id="l"><option value="fr">Français</option><option value="en">English</option></select>':''}<button>${t(m)}</button></form><p style="color:#dc2626">${e}</p></div>`)}
async function go(e){e.preventDefault();const d={pseudo:$('#p').value,pass:$('#w').value,lang:$('#l')?.value},r=await api(mode,d);if(r.t){tk=localStorage.tk=r.t;if(d.lang)L=localStorage.lang=d.lang;boot()}else auth(mode,t(r.err))}
function out(){tk=null;localStorage.removeItem('tk');auth('login')}
async function boot(){if(!tk)return auth();const r=await api('home');if(r.err)return out();
if(r.banned)return show(cage(t('banned'),`${t('until')} ${new Date(r.banned.until).toLocaleString(L)}${r.banned.reason?' — '+esc(r.banned.reason):''}`,1));
if(r.maint)return show(cage(t('maint'),t('msub'),0));H=r;L=localStorage.lang=r.me.lang;home()}
function hd(){return`<header><span class="logo">${LG}</span><button class="o" onclick="prof()">${esc(H.me.pseudo)}</button>${H.me.role=='op'?`<button class="b" onclick="opv()">${t('op')}</button>`:''}<button class="o" onclick="out()">${t('out')}</button></header>${H.set.demo=='1'?`<div class="demo">${t('demo')}</div>`:''}`}
function home(){const sc=Object.fromEntries(H.scores.map(s=>[s.game,s]));show(hd()+`<main><h2>${t('games')}</h2><div class="grid">${GAMES.map(([k,n,u])=>`<div class="card"><b>${n}</b><p>${sc[k]?`${t('best')} : ${esc(sc[k].pseudo)} — ${sc[k].score}`:t('none')}</p><button onclick="play('${k}','${u}')">${t('play')}</button></div>`).join('')}</div>${['site','page'].map(k=>`<h2>${t(k=='site'?'sites':'pages')}</h2><div class="grid">${H.sites.filter(s=>s.kind==k).map(s=>`<div class="card ${s.available?'':'off'}"><b>${esc(s.name)}</b> <span class="badge ${s.available?'':'x'}">${t(s.available?'avail':'un')}</span><p>${esc(s.descr)}</p>${s.available?`<button class="b" onclick="go2('${s.id}')">${t('open')}</button>`:''}</div>`).join('')}</div>`).join('')}</main>`)}
async function go2(id){const w=window.open('','_blank'),r=await api('click',{id});if(r.url)w.location=r.url;else w.close()}
function play(g,u){show(`<div class="c"><div class="logo" style="margin:0">${LG}</div><div class="bar"><i></i></div><p>${t('load')}</p><div id="tp"></div><small>by Noln_mry</small></div>`);
api('tip',{lang:L}).then(r=>{if(r.tip)$('#tp').innerHTML=`<div class="tip"><b>${esc(r.tip.title)}</b><p>${esc(r.tip.body)}</p>${r.tip.code?`<pre>${esc(r.tip.code)}</pre>`:''}</div>`});api('played',{g});setTimeout(()=>location.href=u,2600)}
function prof(m=''){show(hd()+`<main><h2>${t('profile')}</h2><p><b>${esc(H.me.pseudo)}</b></p><p>${t('lang')} : <select onchange="setl(this.value)"><option value="fr" ${L=='fr'?'selected':''}>Français</option><option value="en" ${L=='en'?'selected':''}>English</option></select></p><h3>${t('bug')}</h3>${H.set.demo=='1'?`<form onsubmit="bug(event)"><select id="g">${GAMES.map(g=>`<option>${g[1]}</option>`).join('')}<option>Site</option></select><textarea id="m" rows="4" maxlength="500" placeholder="${t('msg')}" required></textarea><button class="b">${t('send')}</button></form><p>${m}</p>`:`<p>${t('nodemo')}</p>`}<button class="o" onclick="home()">${t('back')}</button></main>`)}
async function setl(v){await api('lang',{lang:v});L=localStorage.lang=v;H.me.lang=v;prof()}
async function bug(e){e.preventDefault();const r=await api('bug',{game:$('#g').value,msg:$('#m').value});prof(r.ok?t('sent'):t('nodemo'))}
const A=(a,d,c)=>`onclick="${c?"if(!confirm('Supprimer ?'))return;":''}act('${a}',${esc(JSON.stringify(d))})"`;
async function act(a,d){await api(a,d);opv()}async function fs(e,a){e.preventDefault();await act(a,Object.fromEntries(new FormData(e.target)))}
function ban(id,h){const reason=prompt('Motif du bannissement ?');if(reason!==null)act('ban',{id,h,reason})}
async function opv(){O=await api('op');if(O.err)return home();const on=k=>O.set[k]=='1',now=new Date();
show(hd()+`<main><button class="o" onclick="home()">${t('back')}</button><h2>Réglages</h2><button class="${on('maintenance')?'r':'b'}" ${A('setting',{k:'maintenance',v:!on('maintenance')})}>Maintenance : ${on('maintenance')?'ACTIVE (désactiver)':'inactive (activer)'}</button> <button class="${on('demo')?'r':'b'}" ${A('setting',{k:'demo',v:!on('demo')})}>Mode démo : ${on('demo')?'ACTIF (arrêter)':'inactif (lancer)'}</button>
<h2>Sites et pages web</h2><form onsubmit="fs(event,'site_add')"><input name="name" placeholder="Nom" required><input name="url" type="url" placeholder="https://…" required><input name="descr" placeholder="Courte description"><select name="kind"><option value="site">Site</option><option value="page">Page web</option></select><button>Ajouter</button></form>
<div class="row"><table>${O.sites.map(s=>`<tr><td>${esc(s.name)}</td><td><span class="badge ${s.available?'':'x'}">${s.available?'Disponible':'Indisponible'}</span></td><td><button class="o" ${A('site_toggle',{id:s.id})}>Changer</button> <button class="r" ${A('site_del',{id:s.id},1)}>Supprimer</button></td></tr>`).join('')}</table></div>
<h2>Clics récents</h2><div class="row"><table>${O.clicks.map(c=>`<tr><td>${esc(c.pseudo)}</td><td>${esc(c.sites?.name)}</td><td>${new Date(c.at).toLocaleString()}</td><td>${c.ok?'✓ marche':'✗ ne répond pas'}</td></tr>`).join('')}</table></div>
<h2>Tutos et astuces</h2><form onsubmit="fs(event,'tip_add')"><select name="lang"><option value="fr">Français</option><option value="en">English</option></select><input name="title" placeholder="Titre" required><textarea name="body" rows="2" placeholder="Astuce" required></textarea><textarea name="code" rows="2" placeholder="Exemple de code (facultatif)"></textarea><button>Ajouter</button></form>
<div class="row"><table>${O.tips.map(s=>`<tr><td>${esc(s.title)} (${s.lang})</td><td><button class="o" ${A('tip_toggle',{id:s.id})}>${s.active?'Active':'Inactive'}</button></td><td><button class="r" ${A('tip_del',{id:s.id},1)}>Supprimer</button></td></tr>`).join('')}</table></div>
<h2>Joueurs</h2><div class="row"><table>${O.users.map(u=>{const b=u.banned_until&&new Date(u.banned_until)>now;return`<tr><td>${esc(u.pseudo)}</td><td>${u.lang}</td><td>${esc(u.last_game||'-')}</td><td>${b?'Banni jusqu\'au '+new Date(u.banned_until).toLocaleString():'OK'}</td><td>${u.role=='op'?'':`<button class="r" onclick="ban('${u.id}',1)">1 h</button> <button class="r" onclick="ban('${u.id}',24)">24 h</button> <button class="r" onclick="ban('${u.id}',168)">7 j</button> <button class="o" ${A('unban',{id:u.id})}>Débannir</button>`}</td></tr>`}).join('')}</table></div>
<h2>Bugs signalés</h2><div class="row"><table>${O.bugs.map(b=>`<tr><td>${esc(b.pseudo)}</td><td>${esc(b.game)}</td><td>${esc(b.msg)}</td><td><button class="r" ${A('bug_del',{id:b.id},1)}>Supprimer</button></td></tr>`).join('')}</table></div></main>`)}
boot();
</script></body></html>
